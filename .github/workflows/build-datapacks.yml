name: Build datapacks

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Package and inspect datapacks
        shell: bash
        run: python3 .github/scripts/package_packs.py --output dist

      - name: Upload base pack ZIP
        uses: actions/upload-artifact@v7
        with:
          path: dist/zombies_build_kit.zip
          archive: false
          if-no-files-found: error

      - name: Upload template ZIP
        uses: actions/upload-artifact@v7
        with:
          path: dist/zbk_template.zip
          archive: false
          if-no-files-found: error
